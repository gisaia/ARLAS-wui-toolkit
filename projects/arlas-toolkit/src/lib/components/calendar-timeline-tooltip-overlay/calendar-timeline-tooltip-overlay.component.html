<div class="wrapper">
  <div class="xline" style="margin-bottom: 5px;">
    <div class="title">
      <div >{{tooltip.stringDate}}</div>
      @let name = tooltip.data?.metadata?.name;
      @if (name) {
        <div class="category">{{name}}</div>
      }
    </div>

    @let thumbnail = tooltip.data?.metadata?.thumbnail;
    @if (thumbnail) {
      <div class="image">
        <img src="{{thumbnail}}" width="250">
      </div>
    }
  </div>
</div>
