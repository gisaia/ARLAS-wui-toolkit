<div class="arlas-search-container">
  <mat-icon class="search">search</mat-icon>
  <div class="search-text" [class.search-text-empty]="displayedSearchValue() === searchPlaceholder()" (click)="openDialog()">
    {{ displayedSearchValue() }}
  </div>
  @if (displayedSearchValue() !== searchPlaceholder()) {
    <button mat-icon-button type="button" class="close"
      (click)="clearSearch()" [matTooltip]="'Remove search text' | translate">
      <mat-icon class="icon">close</mat-icon>
    </button>
  }
</div>
